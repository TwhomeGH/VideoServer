name: dvn-testing
services:
  video-node:
    image: dvn/video-node:local
    build:
      context: ..
      target: video-node
      args:
        VCS_REF: ${DVN_COMMIT:-unknown}
        DIRTY: ${DVN_DIRTY:-true}
        BUILD_TIME: ${DVN_BUILD_TIME:-unknown}
        SOURCE_DIGEST: ${DVN_SOURCE_DIGEST:-unknown}
    ports:
      - "${DVN_TEST_BIND_ADDRESS:-0.0.0.0}:${DVN_TEST_NODE_PORT:-18710}:18610"
    environment:
      DVN_ADMIN_PASSWORD: ${DVN_ADMIN_PASSWORD:-}
    volumes:
      - node-data:/data
      - type: bind
        source: ./local/config/video-node.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./local/media
        target: /media
        read_only: true
        bind:
          create_host_path: false
    init: true
    restart: unless-stopped
  central:
    profiles: [all]
    image: dvn/central:local
    build:
      context: ..
      target: central
      args:
        VCS_REF: ${DVN_COMMIT:-unknown}
        DIRTY: ${DVN_DIRTY:-true}
        BUILD_TIME: ${DVN_BUILD_TIME:-unknown}
        SOURCE_DIGEST: ${DVN_SOURCE_DIGEST:-unknown}
    ports:
      - "${DVN_TEST_BIND_ADDRESS:-0.0.0.0}:${DVN_TEST_CENTRAL_PORT:-18720}:18620"
    environment:
      DVN_ADMIN_PASSWORD: ${DVN_ADMIN_PASSWORD:-}
    volumes:
      - central-data:/data
      - type: bind
        source: ./local/config/central.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
    init: true
    restart: unless-stopped
  transcode-worker:
    profiles: [all]
    image: dvn/transcode-worker:local
    build:
      context: ..
      target: transcode-worker
      args:
        VCS_REF: ${DVN_COMMIT:-unknown}
        DIRTY: ${DVN_DIRTY:-true}
        BUILD_TIME: ${DVN_BUILD_TIME:-unknown}
        SOURCE_DIGEST: ${DVN_SOURCE_DIGEST:-unknown}
    ports:
      - "${DVN_TEST_BIND_ADDRESS:-0.0.0.0}:${DVN_TEST_WORKER_PORT:-18730}:18630"
    environment:
      DVN_ADMIN_PASSWORD: ${DVN_ADMIN_PASSWORD:-}
    volumes:
      - worker-data:/data
      - type: bind
        source: ./local/config/transcode-worker.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
    init: true
    restart: unless-stopped
volumes:
  node-data:
  central-data:
  worker-data:
