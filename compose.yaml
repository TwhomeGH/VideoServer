name: dvn
services:
  video-node:
    image: dvn/video-node:local
    build:
      context: .
      target: video-node
      args:
        VCS_REF: ${DVN_COMMIT:-unknown}
        DIRTY: ${DVN_DIRTY:-true}
        BUILD_TIME: ${DVN_BUILD_TIME:-unknown}
        SOURCE_DIGEST: ${DVN_SOURCE_DIGEST:-unknown}
    ports:
      - "${DVN_BIND_ADDRESS:-0.0.0.0}:${DVN_NODE_PORT:-18610}:18610"
    environment:
      DVN_ADMIN_PASSWORD: ${DVN_ADMIN_PASSWORD:-}
    volumes:
      - node-data:/data
      - type: bind
        source: ${DVN_NODE_CONFIG:-./deployments/docker/video-node.json}
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DVN_MEDIA_PATH:-./media}
        target: /media
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
  central:
    profiles: [all]
    image: dvn/central:local
    build:
      context: .
      target: central
      args:
        VCS_REF: ${DVN_COMMIT:-unknown}
        DIRTY: ${DVN_DIRTY:-true}
        BUILD_TIME: ${DVN_BUILD_TIME:-unknown}
        SOURCE_DIGEST: ${DVN_SOURCE_DIGEST:-unknown}
    ports:
      - "${DVN_BIND_ADDRESS:-0.0.0.0}:${DVN_CENTRAL_PORT:-18620}:18620"
    environment:
      DVN_ADMIN_PASSWORD: ${DVN_ADMIN_PASSWORD:-}
    volumes:
      - central-data:/data
      - type: bind
        source: ${DVN_CENTRAL_CONFIG:-./deployments/docker/central.json}
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
  transcode-worker:
    profiles: [all]
    image: dvn/transcode-worker:local
    build:
      context: .
      target: transcode-worker
      args:
        VCS_REF: ${DVN_COMMIT:-unknown}
        DIRTY: ${DVN_DIRTY:-true}
        BUILD_TIME: ${DVN_BUILD_TIME:-unknown}
        SOURCE_DIGEST: ${DVN_SOURCE_DIGEST:-unknown}
    ports:
      - "${DVN_BIND_ADDRESS:-0.0.0.0}:${DVN_WORKER_PORT:-18630}:18630"
    environment:
      DVN_ADMIN_PASSWORD: ${DVN_ADMIN_PASSWORD:-}
    volumes:
      - worker-data:/data
      - type: bind
        source: ${DVN_WORKER_CONFIG:-./deployments/docker/transcode-worker.json}
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
volumes:
  node-data:
  central-data:
  worker-data:
